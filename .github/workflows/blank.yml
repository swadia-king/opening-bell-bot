name: Download PDF and Release

on:
  schedule:
    - cron: '30 00 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # -----------------------------
      # 1. Download PDF safely
      # -----------------------------
      - name: Download PDF
        run: |
          set -euo pipefail

          URL="https://www.icicidirect.com/mailimages/openingbell.pdf"
          TS=$(date +%Y_%m_%d_%H_%M_%S)
          FILE="openingbell_${TS}_${GITHUB_RUN_ID}.pdf"

          echo "Downloading $URL ..."
          curl -L --fail --retry 3 --retry-delay 2 -o "$FILE" "$URL"

          # Save to global environment for subsequent steps
          echo "FILE=$FILE" >> $GITHUB_ENV

      # -----------------------------
      # 2. Create release safely
      # -----------------------------
      - name: Create Release and Upload File
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} 
        run: |
          set -euo pipefail

          FILE="${{ env.FILE }}"
          TAG="v$(date +%Y%m%d-%H%M%S)-${GITHUB_RUN_ID}"

          echo "Creating release: $TAG"
          echo "Uploading file: $FILE"

          # Added --repo flag here to bypass the "not a git repository" error
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release already exists, skipping..."
            exit 0
          fi

          # Added --repo flag here as well
          gh release create "$TAG" "$FILE" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Opening Bell PDF $TAG" \
            --notes "Auto-downloaded PDF from ICICI Direct" \
            --latest
      # -----------------------------
      # 3. Native Cleanup (Keeps latest 100)
      # -----------------------------
      - name: Delete Older Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          KEEP_COUNT=100
          echo "Checking for releases older than the latest $KEEP_COUNT..."

          # Fetch all release tags sorted from newest to oldest, skipping the first 365
          # --limit 1000 ensures it catches older ones if you accumulate a lot over time
          OLD_RELEASES=$(gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 | cut -f3 | tail -n +$((KEEP_COUNT + 1)))

          if [ -z "$OLD_RELEASES" ]; then
            echo "No old releases to clean up."
          else
            for OLD_TAG in $OLD_RELEASES; do
              echo "Deleting old release and tag: $OLD_TAG"
              gh release delete "$OLD_TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
            done
          fi          
